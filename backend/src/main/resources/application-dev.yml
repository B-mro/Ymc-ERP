spring:
  devtools:
    restart:
      enabled: true
      additional-paths: src/main/java,src/main/resources
      trigger-file: .reloadtrigger
  datasource:
    driver-class-name: com.mysql.cj.jdbc.Driver
    url: jdbc:mysql://121.43.236.24:3306/db_test?useUnicode=true&characterEncoding=utf8&serverTimezone=Asia/Shanghai&useSSL=false&allowPublicKeyRetrieval=true
    username: user_test
    password: w46YpdkzZrFzfX7n
    hikari:
      keepalive-time: 300000
      connection-timeout: 15000
      max-lifetime: 1800000
      idle-timeout: 600000
      minimum-idle: 2

mybatis-plus:
  configuration:
    log-impl: org.apache.ibatis.logging.slf4j.Slf4jImpl

jwt:
  secret: ${JWT_SECRET:rbac-dev-secret-9f3a7b2c1d8e4f5a6b7c8d9e0f1a2b3c}
