# ============================================================
# 测试环境 (test)
# 用途：测试服务器部署，供 QA 测试
# 特点：Knife4j 开启方便 QA 调试、SQL 不打印、密码走环境变量
# ============================================================

spring:
  datasource:
    driver-class-name: com.mysql.cj.jdbc.Driver
    url: jdbc:mysql://${DB_HOST:test-db.internal.company.com}:${DB_PORT:3306}/${DB_NAME:rbac_admin_test}?useUnicode=true&characterEncoding=utf8&serverTimezone=Asia/Shanghai&useSSL=${DB_SSL:true}&allowPublicKeyRetrieval=true
    username: ${DB_USER:rbac_test}
    password: ${DB_PASSWORD}

mybatis-plus:
  configuration:
    log-impl: org.apache.ibatis.logging.slf4j.Slf4jImpl

jwt:
  secret: ${JWT_SECRET}
  expire: 43200000
  header: Authorization

knife4j:
  enable: true
  setting:
    language: zh_cn

cors:
  allowed-origins:
    - ${CORS_FRONT_URL:https://test-admin.company.com}

logging:
  level:
    com.example.rbac: info